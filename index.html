<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>💕 A Cute Question 💕</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #ffd6e7, #d8ecff);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ---------------- BACKGROUND ---------------- */

    .emoji-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .emoji {
      position: absolute;
      font-size: 25px;
      opacity: 0.65;
      animation: float 5s infinite ease-in-out;
    }

    .emoji:nth-child(2) {
      animation-delay: 1s;
    }

    .emoji:nth-child(3) {
      animation-delay: 2s;
    }

    .emoji:nth-child(4) {
      animation-delay: 0.5s;
    }

    .emoji:nth-child(5) {
      animation-delay: 1.5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-30px) rotate(12deg);
      }
    }

    /* ---------------- MAIN BOX ---------------- */

    .container {
      position: relative;
      z-index: 2;
      width: 92%;
      max-width: 440px;
      text-align: center;

      background: rgba(255, 255, 255, 0.85);

      padding: 30px 22px;
      border-radius: 30px;

      box-shadow:
        0 20px 50px rgba(0,0,0,0.15),
        0 0 30px rgba(255,120,170,0.15);

      backdrop-filter: blur(12px);

      animation: appear 0.8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ---------------- ANIME CHARACTER ---------------- */

    .anime {
      width: 155px;
      height: 155px;

      margin: 0 auto 18px;

      border-radius: 50%;
      background: #ffe0bd;

      position: relative;

      animation: bounce 1.6s infinite ease-in-out;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.15),
        0 0 20px rgba(255,150,180,0.25);
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* Hair */

    .hair {
      position: absolute;

      width: 160px;
      height: 88px;

      top: -8px;
      left: -3px;

      background: #5b3a29;

      border-radius:
        80px 80px 35px 35px;
    }

    /* Eyes */

    .eye {
      position: absolute;

      width: 18px;
      height: 25px;

      background: #333;

      border-radius: 50%;

      top: 68px;

      animation: blink 4s infinite;
    }

    .eye.left {
      left: 43px;
    }

    .eye.right {
      right: 43px;
    }

    @keyframes blink {
      0%, 94%, 100% {
        transform: scaleY(1);
      }

      97% {
        transform: scaleY(0.1);
      }
    }

    /* Blush */

    .blush {
      position: absolute;

      width: 27px;
      height: 13px;

      background: #ff8fa8;

      border-radius: 50%;

      top: 94px;

      opacity: 0.7;
    }

    .blush.left {
      left: 15px;
    }

    .blush.right {
      right: 15px;
    }

    /* Mouth */

    .mouth {
      position: absolute;

      width: 32px;
      height: 17px;

      border-bottom: 4px solid #d65a75;

      border-radius: 50%;

      bottom: 35px;
      left: 61px;
    }

    /* ---------------- TEXT ---------------- */

    h1 {
      color: #ff5f8f;

      margin: 8px 0 12px;

      font-size: 30px;

      text-shadow:
        0 2px 5px rgba(255,95,143,0.15);
    }

    p {
      color: #555;

      font-size: 17px;

      line-height: 1.7;

      margin-bottom: 22px;
    }

    /* ---------------- BUTTONS ---------------- */

    button {
      border: none;

      border-radius: 17px;

      padding: 14px 22px;

      margin: 6px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      color: white;

      transition:
        transform 0.25s,
        box-shadow 0.25s,
        background 0.25s;
    }

    button:hover {
      transform: scale(1.08);

      box-shadow:
        0 8px 20px rgba(0,0,0,0.15);
    }

    button:active {
      transform: scale(0.95);
    }

    .gay {
      background: linear-gradient(
        135deg,
        #32b86c,
        #20a85b
      );
    }

    .question {
      background: linear-gradient(
        135deg,
        #3489e8,
        #5a6ff0
      );
    }

    .yes {
      background: linear-gradient(
        135deg,
        #32b86c,
        #18a957
      );

      position: relative;
    }

    .no {
      background: #777;

      position: relative;
    }

    #questionPage {
      display: none;
    }

    /* ---------------- RESULT ---------------- */

    .result {
      display: none;

      color: #ff4f87;

      font-size: 22px;

      font-weight: bold;

      margin-top: 18px;

      animation: pop 0.5s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.3);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ---------------- HEARTS ---------------- */

    .heart {
      position: fixed;

      bottom: -30px;

      font-size: 25px;

      pointer-events: none;

      animation: heartFloat 4s linear forwards;

      z-index: 5;
    }

    @keyframes heartFloat {
      0% {
        transform:
          translateY(0)
          scale(0.7)
          rotate(0deg);

        opacity: 1;
      }

      100% {
        transform:
          translateY(-100vh)
          scale(1.4)
          rotate(30deg);

        opacity: 0;
      }
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 480px) {

      .container {
        padding: 25px 17px;
      }

      .anime {
        width: 135px;
        height: 135px;
      }

      .hair {
        width: 140px;
        height: 78px;
      }

      .eye {
        top: 60px;
      }

      .eye.left {
        left: 36px;
      }

      .eye.right {
        right: 36px;
      }

      .mouth {
        left: 52px;
        bottom: 30px;
      }

      .blush {
        top: 84px;
      }

      h1 {
        font-size: 26px;
      }

      p {
        font-size: 16px;
      }

      button {
        font-size: 16px;
        padding: 13px 18px;
      }
    }
  </style>
</head>

<body>

  <!-- Floating background emojis -->

  <div class="emoji-bg">

    <span class="emoji" style="left:5%;top:8%">😂</span>
    <span class="emoji" style="left:15%;top:30%">🤣</span>
    <span class="emoji" style="left:28%;top:12%">😂</span>
    <span class="emoji" style="left:42%;top:35%">🤣</span>
    <span class="emoji" style="left:58%;top:10%">😂</span>
    <span class="emoji" style="left:72%;top:28%">🤣</span>
    <span class="emoji" style="left:88%;top:12%">😂</span>

    <span class="emoji" style="left:8%;top:70%">🤣</span>
    <span class="emoji" style="left:25%;top:85%">😂</span>
    <span class="emoji" style="left:45%;top:68%">🤣</span>
    <span class="emoji" style="left:65%;top:88%">😂</span>
    <span class="emoji" style="left:82%;top:67%">🤣</span>
    <span class="emoji" style="left:93%;top:88%">😂</span>

  </div>


  <!-- Main container -->

  <div class="container">

    <!-- HOME PAGE -->

    <div id="homePage">

      <div class="anime">

        <div class="hair"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="blush left"></div>
        <div class="blush right"></div>

        <div class="mouth"></div>

      </div>


      <h1>
        ဟယ်လို 👋💕
      </h1>

      <p>
        ချစ်စရာကောင်းတဲ့<br>
        မေးခွန်းလေးတစ်ခုရှိတယ် 😆💭
      </p>


      <button
        class="gay"
        onclick="gayClicked()">

        I am gay 🌈

      </button>


      <button
        class="question"
        onclick="showQuestion()">

        မေးခွန်းဖြေမယ် 💙

      </button>

    </div>


    <!-- QUESTION PAGE -->

    <div id="questionPage">

      <div class="anime">

        <div class="hair"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="blush left"></div>
        <div class="blush right"></div>

        <div class="mouth"></div>

      </div>


      <h1>
        မေးခွန်းလေး 💭
      </h1>


      <p>
        ငါနဲ့နင် friends ဖြစ်လာတာ
        နှစ်မနည်းတော့ဘူး။ ❤️<br><br>

        ငါမသေချာတာက...<br>

        <strong>နင်က gay လား? 🌈</strong>
      </p>


      <button
        class="no"
        id="noButton"
        onclick="noClicked()">

        No ❌

      </button>


      <button
        class="yes"
        id="yesButton"
        onclick="yesClicked()">

        Yes 💚

      </button>


      <div
        class="result"
        id="result">

        Yesss! 😆🌈💕<br>

        <span style="font-size:16px;">
          I knew it! 😂❤️
        </span>

      </div>

    </div>

  </div>


  <script>

    /* ---------------- PAGE CHANGE ---------------- */

    function showQuestion() {

      document.getElementById("homePage").style.display = "none";

      document.getElementById("questionPage").style.display = "block";

    }


    /* ---------------- GAY BUTTON ---------------- */

    function gayClicked() {

      alert(
        "🌈 Yay! Thanks for being honest! 💚😂"
      );

      createHearts();

    }


    /* ---------------- NO BUTTON ---------------- */

    function noClicked() {

      const noButton =
        document.getElementById("noButton");

      const yesButton =
        document.getElementById("yesButton");


      /*
        Move the No button
        to a random position
      */

      const maxX =
        window.innerWidth - noButton.offsetWidth - 30;

      const maxY =
        window.innerHeight - noButton.offsetHeight - 30;


      const x =
        Math.random() * maxX;

      const y =
        Math.random() * maxY;


      noButton.style.position = "fixed";

      noButton.style.left = x + "px";

      noButton.style.top = y + "px";


      /*
        Make Yes button bigger
      */

      let currentSize =
        parseFloat(
          window.getComputedStyle(
            yesButton
          ).fontSize
        );

      if (currentSize < 25) {

        currentSize += 2;

        yesButton.style.fontSize =
          currentSize + "px";

        yesButton.style.padding =
          "16px 25px";
      }

    }


    /* ---------------- YES BUTTON ---------------- */

    function yesClicked() {

      const result =
        document.getElementById("result");

      const yesButton =
        document.getElementById("yesButton");

      const noButton =
        document.getElementById("noButton");


      result.style.display = "block";


      yesButton.innerHTML =
        "YES! 🌈💚✨";


      yesButton.style.transform =
        "scale(1.15)";


      noButton.style.display =
        "none";


      createHearts();


      setTimeout(createHearts, 500);

      setTimeout(createHearts, 1000);

    }


    /* ---------------- FLOATING HEARTS ---------------- */

    function createHearts() {

      const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💘",
        "🌈",
        "✨",
        "😂"
      ];


      for (let i = 0; i < 15; i++) {

        const heart =
          document.createElement("div");


        heart.className =
          "heart";


        heart.innerHTML =
          hearts[
            Math.floor(
              Math.random() * hearts.length
            )
          ];


        heart.style.left =
          Math.random() * 100 + "vw";


        heart.style.animationDuration =
          (3 + Math.random() * 3) + "s";


        heart.style.fontSize =
          (18 + Math.random() * 20) + "px";


        document.body.appendChild(heart);


        setTimeout(() => {

          heart.remove();

        }, 6000);

      }

    }

  </script>

</body>
</html>
